[env]
_.path = ["./node_modules/.bin"]

[tools]
node = "25.4.0"

[tasks."codegen:data"]
description = "Run update.sh"
run = "./update.sh"

[tasks."codegen:fmt"]
depends = ["fmt"]

[tasks."fmt:dprint"]
run = "dprint fmt"

[tasks."fmt"]
depends = ["fmt:*"]

[tasks.codegen]
description = "Generate all code"
depends = ["codegen:*"]

[tasks.install]
description = "Install npm dependencies"
run = "npm install"

[tasks.dev]
description = "Start Astro dev server"
depends = ["install"]
run = "npm run dev"
