[env]
_.path = ["./node_modules/.bin"]

[tools]
node = "25.4.0"
pnpm = "11.22.0"

[tasks."codegen:data"]
description = "Run update.sh"
run = "./update.sh"

[tasks."codegen:fmt"]
depends = ["fmt"]

[tasks."fmt:dprint"]
run = "dprint fmt"

[tasks."fmt"]
depends = ["fmt:*"]

[tasks.codegen]
description = "Generate all code"
depends = ["codegen:*"]

[tasks.install]
description = "Install pnpm dependencies"
run = "pnpm install"
sources = ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml"]
outputs = ["node_modules/.pnpm/lock.yaml"]

[tasks.dev]
description = "Start Astro dev server"
depends = ["install"]
run = "pnpm dev"
